<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Расчет премии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Расчет годовой премии</h3>
    <div class="card">
        <div class="card-body">
            <p><b>Сотрудник:</b> <span th:text="${employee.surname} + ' ' + ${employee.name}"></span></p>
            <p><b>Месячный оклад:</b> <span th:text="${employee.salary}"></span> ₽</p>
            <p><b>Годовая премия (15% от годового ФОТ):</b>
                <span class="text-success fw-bold"
                      th:text="${#numbers.formatDecimal(bonus, 1, 'COMMA', 2, 'POINT')}"></span> ₽
            </p>
            <p class="text-muted">Формула: оклад × 0.15 × 12</p>
        </div>
    </div>
    <a th:href="@{/employees/list}" class="btn btn-secondary mt-3">Назад</a>
</div>
</body>
</html>
