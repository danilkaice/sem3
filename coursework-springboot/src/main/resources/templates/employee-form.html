<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сотрудник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Данные сотрудника</h3>
    <form th:action="@{/employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label>Фамилия</label>
            <input type="text" th:field="*{surname}" class="form-control"/>
            <p th:errors="*{surname}" class="text-danger"></p>
        </div>
        <div class="mb-3">
            <label>Имя</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <p th:errors="*{name}" class="text-danger"></p>
        </div>
        <div class="mb-3">
            <label>Возраст</label>
            <input type="number" th:field="*{age}" class="form-control"/>
            <p th:errors="*{age}" class="text-danger"></p>
        </div>
        <div class="mb-3">
            <label>Отдел</label>
            <input type="text" th:field="*{department}" class="form-control"/>
            <p th:errors="*{department}" class="text-danger"></p>
        </div>
        <div class="mb-3">
            <label>Оклад</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control"/>
            <p th:errors="*{salary}" class="text-danger"></p>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/employees/list}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>l>
