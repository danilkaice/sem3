<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Система учета сотрудников</a>
    </div>
</nav>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div th:if="${param.error}" class="alert alert-danger">Неверный email или пароль</div>
            <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>
            <div class="card">
                <div class="card-header"><h2 class="text-center">Вход</h2></div>
                <div class="card-body">
                    <form method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="text" name="username" class="form-control" placeholder="Введите email"/>
                        </div>
                        <div class="mb-3">
                            <label>Пароль</label>
                            <input type="password" name="password" class="form-control" placeholder="Введите пароль"/>
                        </div>
                        <button type="submit" class="btn btn-primary">Войти</button>
                        <span>Нет аккаунта? <a th:href="@{/register}">Зарегистрируйтесь</a></span>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
